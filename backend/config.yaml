scraper:
  sources:
    - name: indeed
      url: "https://www.indeed.com/jobs?q=python+developer&l="
      selectors:
        job_card: "div.job_seen_beacon"
        title: "h2.jobTitle a"
        company: "span.companyName"
        location: "div.companyLocation"
        salary: "div.salary-snippet-container"
    
    - name: linkedin
      url: "https://www.linkedin.com/jobs/search?keywords=python+developer"
      selectors:
        job_card: "div.base-card"
        title: "h3.base-search-card__title"
        company: "h4.base-search-card__subtitle"
        location: "span.job-search-card__location"
        salary: null
    
    - name: glassdoor
      url: "https://www.glassdoor.com/Job/jobs.htm?sc.keyword=python+developer"
      selectors:
        job_card: "li[data-test='jobListing']"
        title: "a[data-test='job-title']"
        company: "span[data-test='employer-short-name']"
        location: "span[data-test='emp-location']"
        salary: "span[data-test='detailSalary']"
  
  schedule:
    interval_minutes: 60
    max_retries: 3
    timeout_seconds: 10
  
  output:
    database: "sqlite:///jobs.db"
    max_jobs_per_source: 10
